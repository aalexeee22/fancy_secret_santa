services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=santa
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Seteaza POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=santa
    # Fără "ports": doar containerul web ajunge la baza de date, prin rețeaua internă Docker.
    # Pentru dezvoltare locală, portul e deschis doar pe 127.0.0.1 în docker-compose.override.yml.
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santa -d santa"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # Nume fix: pe un server fără cod, compose folosește imaginea încărcată cu docker load.
    image: secret-santa-web:latest
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://santa:${POSTGRES_PASSWORD}@db:5432/santa
      - SECRET_KEY=${SECRET_KEY:?Seteaza SECRET_KEY in .env}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8000}
      - CORS_ORIGINS=${PUBLIC_URL:-http://localhost:8000}
      - BEHIND_PROXY=${BEHIND_PROXY:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
