<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<!-- Pisica hoață: pisică neagră cu mască de bandit, căciulă neagră și sac -->
<defs>
<radialGradient id="fur" cx=".45" cy=".4" r=".75"><stop stop-color="#4a4a58"/><stop offset="1" stop-color="#22222b"/></radialGradient>
<radialGradient id="sack" cx=".4" cy=".35" r=".75"><stop stop-color="#5a4a3a"/><stop offset="1" stop-color="#2a2018"/></radialGradient>
<linearGradient id="hat" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#2e2e38"/><stop offset="1" stop-color="#0d0d12"/></linearGradient>
<radialGradient id="pom" cx=".35" cy=".3" r=".8"><stop stop-color="#ff4d5e"/><stop offset="1" stop-color="#b3001e"/></radialGradient>
<radialGradient id="eye" cx=".4" cy=".35" r=".7"><stop stop-color="#fff27a"/><stop offset="1" stop-color="#e6a812"/></radialGradient>
</defs>
<!-- sacul -->
<path d="M128 150c-14-30-6-66 20-80 24-12 46 8 46 38 0 30-16 52-40 56Z" fill="url(#sack)"/>
<path d="M140 74c4-6 14-8 20-4" stroke="#1a140e" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="156" y="104" width="18" height="16" rx="3" fill="#8a7458" transform="rotate(10 165 112)"/>
<path d="M158 107l14 2M157 117l14 2" stroke="#c8b08a" stroke-width="1.3" stroke-dasharray="2 2"/>
<g transform="rotate(12 158 66)"><rect x="146" y="54" width="22" height="18" rx="2" fill="#c8102e"/><rect x="154" y="54" width="6" height="18" fill="#ffd34d"/></g>
<!-- corpul și coada -->
<path d="M178 196c14-10 18-30 6-40" stroke="#22222b" stroke-width="10" fill="none" stroke-linecap="round"/>
<path d="M50 200c0-40 22-62 50-62s50 22 50 62Z" fill="url(#fur)"/>
<path d="M82 200c0-26 8-40 18-40s18 14 18 40Z" fill="#5b5b6a"/>
<circle cx="140" cy="150" r="10" fill="#33333e"/>
<!-- urechile -->
<path d="M52 88 46 30l44 30Z" fill="#2b2b35"/>
<path d="M58 78 55 44l22 18Z" fill="#f2a0b0"/>
<path d="M148 88l6-58-44 30Z" fill="#2b2b35"/>
<path d="M142 78l3-34-22 18Z" fill="#f2a0b0"/>
<!-- capul -->
<ellipse cx="100" cy="104" rx="56" ry="48" fill="url(#fur)"/>
<ellipse cx="100" cy="124" rx="26" ry="18" fill="#5b5b6a"/>
<!-- masca de bandit, cu panglici -->
<path d="M48 96c-10-2-20 0-30-4 6 8 12 10 18 12-6 4-10 8-14 14 10-4 20-10 28-14Z" fill="#050508"/>
<path d="M46 92c20-12 88-12 108 0 2 8 0 16-4 20-16-4-30-2-38 4-8 2-16 2-24 0-8-6-22-8-38-4-4-4-6-12-4-20Z" fill="#050508" stroke="#6b6b7a" stroke-width="1.5"/>
<!-- ochii: unul deschis, unul face cu ochiul -->
<ellipse cx="78" cy="100" rx="11" ry="10" fill="url(#eye)"/>
<ellipse cx="80" cy="100" rx="3.5" ry="8" fill="#111"/>
<circle cx="82" cy="96" r="2.2" fill="#fff"/>
<path d="M112 102q10-9 20 0" stroke="#fff27a" stroke-width="4" fill="none" stroke-linecap="round"/>
<!-- botul, nasul, zâmbetul -->
<path d="M94 116h12l-6 7Z" fill="#f28ca0"/>
<path d="M100 123q-4 8-12 5M100 123q6 8 14 2" stroke="#15151b" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M60 118l-26-4M60 126l-24 4M140 118l26-4M140 126l24 4" stroke="#e8e8f0" stroke-width="1.8" stroke-linecap="round"/>
<!-- căciula neagră cu moț roșu, pusă strâmb -->
<g transform="translate(200 0) scale(-1 1) rotate(-10 100 60)">
<path d="M58 66C60 36 86 14 116 16c22 2 38 14 44 34-12-8-26-10-34-4-4 6-4 12-4 20Z" fill="url(#hat)"/>
<rect x="52" y="60" width="96" height="15" rx="7.5" fill="#45454f"/>
<circle cx="161" cy="52" r="11" fill="url(#pom)"/>
</g>
</svg>
