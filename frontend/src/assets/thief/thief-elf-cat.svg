<path d="M78 98h40l14 50-8-6-7 7-7-7-7 7-7-7-7 7-7-7-7 7-6-6Z" fill="url(#tunic)"/>
<rect x="72" y="126" width="54" height="8" fill="#0a0a0d"/>
<rect x="92" y="124" width="12" height="12" rx="2" fill="none" stroke="#ffc83d" stroke-width="3"/>
<path d="M76 98l6 8 6-8 6 8 6-8 6 8 6-8 6 8 6-8Z" fill="#c8102e"/>
<!-- cadoul -->
<path d="M84 112c10 6 20 8 30 4" stroke="url(#tunic)" stroke-width="10" fill="none" stroke-linecap="round"/>
<g transform="rotate(-8 140 112)"><rect x="116" y="92" width="48" height="40" rx="3" fill="#c8102e"/><rect x="136" y="92" width="8" height="40" fill="#ffd34d"/><rect x="116" y="108" width="48" height="8" fill="#ffd34d"/><path d="M140 92c-10-14-24-8-14-2 6 3 14 2 14 2Zm0 0c10-14 24-8 14-2-6 3-14 2-14 2Z" fill="#ffd34d"/></g>
<circle cx="118" cy="118" r="7" fill="#fff"/>
<circle cx="160" cy="104" r="7" fill="#fff"/>
<path d="M120 100c12-6 26-6 38 2" stroke="url(#tunic)" stroke-width="9" fill="none" stroke-linecap="round"/>
<!-- urechile de pisică, ieșind de sub căciulă -->
<path d="M70 66 62 30l26 22Z" fill="#fff"/>
<path d="M72 60 68 40l12 12Z" fill="#f2a0b0"/>
<path d="M126 66l8-36-26 22Z" fill="#fff"/>
<path d="M124 60l4-20-12 12Z" fill="#f2a0b0"/>
<!-- capul -->
<ellipse cx="98" cy="76" rx="32" ry="26" fill="url(#fur)"/>
<ellipse cx="99" cy="88" rx="13" ry="9" fill="#fff"/>
<path d="M95 83h8l-4 5Z" fill="#f28ca0"/>
<path d="M99 88q-3 6-9 4M99 88q5 6 11 2" stroke="#4a4a56" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M76 86l-22-3M76 92l-20 4M122 86l22-3M122 92l20 4" stroke="#9a9aa8" stroke-width="1.6" stroke-linecap="round"/>
<!-- masca -->
<path d="M68 70c-10-4-22-2-32-8 4 8 10 12 18 14-8 2-14 6-18 12 10-2 22-6 32-12Z" fill="#0b0b0f"/>
<path d="M66 66c12-7 52-7 64 0 2 5 1 10-2 13-9-2-16 0-20 3-6 2-12 2-17 0-5-3-12-5-21-3-3-3-5-8-4-13Z" fill="#0b0b0f"/>
<ellipse cx="86" cy="72" rx="7" ry="6" fill="url(#eye)"/>
<ellipse cx="88" cy="72" rx="2" ry="5" fill="#111"/>
<circle cx="89.5" cy="69.5" r="1.2" fill="#fff"/>
<ellipse cx="111" cy="72" rx="7" ry="6" fill="url(#eye)"/>
<ellipse cx="113" cy="72" rx="2" ry="5" fill="#111"/>
<circle cx="114.5" cy="69.5" r="1.2" fill="#fff"/>
<!-- căciula de elf: vârful pornește din creștet și flutură în spate, cu clopoțel -->
<path d="M74 55C74 44 79 37 87 33C72 35 56 40 40 42C54 30 78 22 99 25C114 28 122 40 124 55Z" fill="url(#hat)"/>
<path d="M87 33C73 36 58 40 42 42" stroke="#4a4a56" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
<rect x="72" y="50" width="54" height="10" rx="5" fill="#c8102e"/>
<circle cx="37" cy="45" r="8" fill="url(#bell)"/>
<path d="M33 47h8" stroke="#8a6400" stroke-width="1.5" stroke-linecap="round"/>
</svg>
