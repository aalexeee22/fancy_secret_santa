<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<!-- Pisica spiriduș hoață: pisică albă, mască neagră, căciulă de elf neagră, fuge cu cadoul -->
<defs>
<linearGradient id="hat" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#3d3d48"/><stop offset="1" stop-color="#121217"/></linearGradient>
<linearGradient id="tunic" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1f6b46"/><stop offset="1" stop-color="#0d3322"/></linearGradient>
<radialGradient id="fur" cx=".45" cy=".4" r=".75"><stop stop-color="#fff"/><stop offset="1" stop-color="#dcd8e8"/></radialGradient>
<radialGradient id="bell" cx=".35" cy=".3" r=".8"><stop stop-color="#ffe680"/><stop offset="1" stop-color="#d49a00"/></radialGradient>
<radialGradient id="eye" cx=".4" cy=".35" r=".7"><stop stop-color="#b8f5a0"/><stop offset="1" stop-color="#3fae4a"/></radialGradient>
</defs>
<path d="M8 100h26M2 120h30M10 140h22" stroke="#9a9aa8" stroke-width="4" stroke-linecap="round" opacity=".6"/>
<!-- coada -->
<path d="M74 136c-20 4-34-6-38-22" stroke="#e8e5f0" stroke-width="9" fill="none" stroke-linecap="round"/>
<!-- picioarele (lăbuțe albe în fugă) -->
<path d="M82 146 60 174" stroke="#e8e5f0" stroke-width="12" stroke-linecap="round"/>
<ellipse cx="56" cy="177" rx="10" ry="6" fill="#fff"/>
<path d="M104 146l20 28" stroke="#e8e5f0" stroke-width="12" stroke-linecap="round"/>
<ellipse cx="128" cy="177" rx="10" ry="6" fill="#fff"/>
