<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<!-- Moșul Hoț: costum negru, mască de bandit, sac negru, moț roșu -->
<defs>
<linearGradient id="coat" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#33333d"/><stop offset="1" stop-color="#111116"/></linearGradient>
<radialGradient id="sack" cx=".4" cy=".35" r=".75"><stop stop-color="#45454f"/><stop offset="1" stop-color="#16161b"/></radialGradient>
<linearGradient id="hat" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#3d3d48"/><stop offset="1" stop-color="#121217"/></linearGradient>
<radialGradient id="skin" cx=".45" cy=".4" r=".7"><stop stop-color="#ffd9bd"/><stop offset="1" stop-color="#f0b48f"/></radialGradient>
<radialGradient id="pom" cx=".35" cy=".3" r=".8"><stop stop-color="#ff4d5e"/><stop offset="1" stop-color="#b3001e"/></radialGradient>
<linearGradient id="beard" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e4e0ee"/></linearGradient>
</defs>
<!-- sacul, peste umărul drept -->
<path d="M122 122C112 84 128 46 158 40c26-5 40 18 38 48-2 34-18 56-44 60Z" fill="url(#sack)"/>
<rect x="160" y="74" width="20" height="18" rx="3" fill="#5a5a66" transform="rotate(12 170 83)"/>
<path d="M162 77l16 3M161 89l16 3M163 76l-2 14M177 79l-2 14" stroke="#9a9aa8" stroke-width="1.4" stroke-dasharray="2 2"/>
<g transform="rotate(-14 150 40)"><rect x="138" y="26" width="26" height="22" rx="2" fill="#c8102e"/><rect x="148" y="26" width="6" height="22" fill="#ffd34d"/><path d="M151 26c-8-9-16-4-10 0 4 2 10 0 10 0Zm0 0c8-9 16-4 10 0-4 2-10 0-10 0Z" fill="#ffd34d"/></g>
<path d="M138 50c4 4 12 5 18 1" stroke="#0c0c10" stroke-width="5" fill="none" stroke-linecap="round"/>
<!-- corpul -->
<path d="M40 200c0-48 26-74 60-74s60 26 60 74Z" fill="url(#coat)"/>
<path d="M100 132v68" stroke="#4a4a56" stroke-width="7"/>
<rect x="42" y="172" width="116" height="13" fill="#0a0a0d"/>
<rect x="88" y="169" width="24" height="19" rx="3" fill="none" stroke="#ffc83d" stroke-width="4"/>
<!-- mâna care ține sacul -->
<path d="M150 158c-6-14-10-26-14-34" stroke="url(#coat)" stroke-width="18" stroke-linecap="round"/>
<circle cx="136" cy="122" r="10" fill="#1a1a20"/>
<!-- fața -->
<circle cx="100" cy="94" r="34" fill="url(#skin)"/>
<!-- barba -->
<path d="M64 98c-4 22 4 40 16 52 6 8 12 16 20 22 8-6 14-14 20-22 12-12 20-30 16-52-8 10-20 14-36 14s-28-4-36-14Z" fill="url(#beard)"/>
<path d="M76 140q6 6 4 14M100 150v14M124 140q-6 6-4 14" stroke="#d9d4e6" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="78" cy="104" r="7" fill="#ff8f8f" opacity=".55"/>
<circle cx="122" cy="104" r="7" fill="#ff8f8f" opacity=".55"/>
<!-- mustața și zâmbetul strâmb -->
<path d="M100 112c-6-6-18-6-24 2 4 2 10 6 16 4 4-1 6-3 8-6Zm0 0c6-6 18-8 26-2-4 4-10 8-18 6-4-1-6-2-8-4Z" fill="#fff" stroke="#e4e0ee" stroke-width="1"/>
<path d="M92 126q10 6 20-4" stroke="#7a2430" stroke-width="3.2" fill="none" stroke-linecap="round"/>
<circle cx="100" cy="106" r="7" fill="#f2937c"/>
<circle cx="98" cy="104" r="2.2" fill="#fff" opacity=".6"/>
<!-- masca neagră, cu panglicile fluturând -->
<path d="M66 88c-8-4-18-6-28-12 6 8 10 12 18 16-8 2-14 6-20 12 10-2 20-6 30-10Z" fill="#0b0b0f"/>
<path d="M62 84c14-8 62-8 76 0 3 6 2 12-2 16-10-2-20 0-26 4-6 2-14 2-20 0-6-4-16-6-26-4-4-4-5-10-2-16Z" fill="#0b0b0f"/>
<path d="M68 85c14-6 50-6 66-1" stroke="#4d4d5a" stroke-width="2" fill="none" stroke-linecap="round"/>
<!-- ochiul deschis și ochiul care face cu ochiul -->
<ellipse cx="85" cy="92" rx="8" ry="6.5" fill="#fff"/>
<circle cx="88" cy="92" r="4" fill="#1b1b22"/>
<circle cx="89.5" cy="90.5" r="1.4" fill="#fff"/>
<path d="M108 94q8-7 16 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
<!-- sprâncenele: una ridicată -->
<path d="M74 76q10-10 22-4" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M106 78q10-2 20 2" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
<!-- căciula neagră, moțul roșu -->
<g transform="translate(200 -8) scale(-1 1)">
<path d="M68 66C70 36 96 16 126 18c22 2 38 14 44 34-12-8-26-10-34-4-4 6-4 12-4 18Z" fill="url(#hat)"/>
<path d="M84 40c10-12 24-16 38-14" stroke="#5a5a68" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
<rect x="62" y="60" width="78" height="15" rx="7.5" fill="#4a4a56"/>
<path d="M68 64h8m6 4h8m6-4h8m6 4h8m6-4h8" stroke="#62626f" stroke-width="2" stroke-linecap="round"/>
<circle cx="171" cy="54" r="11" fill="url(#pom)"/>
</g>
</svg>
